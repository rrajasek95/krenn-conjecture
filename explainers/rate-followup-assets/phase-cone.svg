<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
  <title id="title">Positive projections prevent cancellation inside a phase cone</title>
  <desc id="desc">Three arrows lie within thirty degrees of the horizontal axis. Each horizontal projection is at least its length times cosine of thirty degrees, so their sum has a positive projection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536780"/></marker>
  </defs>
  <rect width="820" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#17243b">
    <text x="28" y="37" font-size="21" font-weight="650">Phase alignment limits destructive interference</text>
    <path d="M 90 187 L 385 17 L 385 357 Z" fill="#dceae6" opacity=".65" transform="translate(0 36) scale(1 .8)"/>
    <path d="M 90 187 L 390 14 M 90 187 L 390 360" stroke="#9bb7ae" stroke-dasharray="5 5" fill="none" transform="translate(0 36) scale(1 .8)"/>
    <path d="M 55 186 L 465 186" stroke="#536780" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 90 186 L 326 92" stroke="#235b9b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 90 186 L 286 168" stroke="#8154a3" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 90 186 L 345 262" stroke="#19816c" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 326 92 L 326 186 M 345 262 L 345 186" stroke="#667b8f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="90" cy="186" r="4" fill="#17243b"/>
    <text x="140" y="287" font-size="15">positive horizontal projections</text>
    <text x="499" y="127" font-size="18" font-weight="650">Each edge: phase error ≤ φ</text>
    <text x="499" y="166" font-size="18">Three edges per matching</text>
    <text x="499" y="205" font-size="18">Matching phase error ≤ 3φ</text>
    <text x="499" y="253" font-size="22" font-weight="650" fill="#126d59">κ ≥ cos(3φ) &gt; 0</text>
    <text x="28" y="328" font-size="14" fill="#536780">Arrows represent contributions to one output. The common phase is removed before comparing them.</text>
  </g>
</svg>
