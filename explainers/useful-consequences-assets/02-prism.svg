<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="02-prism-title 02-prism-desc">
<title id="02-prism-title">Four matchings make the fidelity–rate tradeoff explicit</title>
<desc id="02-prism-desc">The outer triangle is sites 0,1,2 and the inner triangle 3,4,5. Triangle edges have amplitude t; connecting edges have amplitude t omega. Three pure matchings have amplitude t cubed omega and the one mixed matching has amplitude t cubed omega cubed.</desc>
