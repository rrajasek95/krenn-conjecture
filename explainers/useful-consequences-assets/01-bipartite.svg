<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="01-bipartite-title 01-bipartite-desc">
<title id="01-bipartite-title">A whole architecture class is excluded at every size</title>
<desc id="01-bipartite-desc">Illustrative equal shores. Exact GHZ forces diagonal edges. Deleting opposite sites leaves a nonzero two-color cofactor. The unwanted slice factors as the third-color edge weight times that cofactor, forcing every third-color edge to zero.</desc>
<rect width="1000" height="100%" fill="white" rx="16"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / USEFUL CONSEQUENCES</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">A whole architecture class is excluded at every size</text>
<rect x="30" y="100" width="300" height="300" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<rect x="350" y="100" width="300" height="300" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<rect x="670" y="100" width="300" height="300" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="180" y="132" font-family="system-ui,sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">1. Two groups of output sites</text>
<line x1="80" y1="190" x2="280" y2="190" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="190" x2="280" y2="260" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="190" x2="280" y2="330" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="260" x2="280" y2="190" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="260" x2="280" y2="260" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="260" x2="280" y2="330" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="330" x2="280" y2="190" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="330" x2="280" y2="260" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="330" x2="280" y2="330" stroke="#b9c3ca" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round"/>
<line x1="80" y1="190" x2="280" y2="190" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="80" cy="190" r="15" fill="white" stroke="#bd3847" stroke-width="2"/>
<text x="80" y="195" font-family="system-ui,sans-serif" font-size="14" fill="#bd3847" text-anchor="middle" font-weight="650">p</text>
<circle cx="80" cy="260" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="80" y="265" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">u1</text>
<circle cx="80" cy="330" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="80" y="335" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">u2</text>
<circle cx="280" cy="190" r="15" fill="white" stroke="#bd3847" stroke-width="2"/>
<text x="280" y="195" font-family="system-ui,sans-serif" font-size="14" fill="#bd3847" text-anchor="middle" font-weight="650">t</text>
<circle cx="280" cy="260" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="280" y="265" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">v1</text>
<circle cx="280" cy="330" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="280" y="335" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">v2</text>
<text x="180" y="177" font-family="system-ui,sans-serif" font-size="15" fill="#bd3847" text-anchor="middle" font-weight="600">a-colored edge</text>
<text x="180" y="379" font-family="system-ui,sans-serif" font-size="15" fill="#526171" text-anchor="middle" font-weight="400">Every source crosses the partition</text>
<text x="500" y="132" font-family="system-ui,sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">2. Delete p,t; keep colors b,c</text>
<line x1="400" y1="210" x2="600" y2="210" stroke="#2168af" stroke-width="3" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="400" y1="305" x2="600" y2="305" stroke="#2168af" stroke-width="3" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="400" y1="210" x2="600" y2="305" stroke="#237953" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
<line x1="400" y1="305" x2="600" y2="210" stroke="#237953" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
<circle cx="400" cy="210" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="400" y="215" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">u1</text>
<circle cx="400" cy="305" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="400" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">u2</text>
<circle cx="600" cy="210" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="600" y="215" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">v1</text>
<circle cx="600" cy="305" r="15" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="600" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="650">v2</text>
<text x="500" y="379" font-family="system-ui,sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="600">Whole remaining tensor: K ≠ 0</text>
<text x="820" y="132" font-family="system-ui,sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">3. The mixed slice must vanish</text>
<text x="820" y="215" font-family="system-ui,sans-serif" font-size="22" fill="#202d3a" text-anchor="middle" font-weight="650">a-edge weight × K = 0</text>
<text x="820" y="260" font-family="system-ui,sans-serif" font-size="20" fill="#526171" text-anchor="middle" font-weight="400">K is nonzero</text>
<text x="820" y="310" font-family="system-ui,sans-serif" font-size="19" fill="#bd3847" text-anchor="middle" font-weight="700">Every a-edge has weight 0</text>
<text x="820" y="379" font-family="system-ui,sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">Contradiction: no all-a output</text>
<text x="500" y="436" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">The proof uses whole cofactors, so complex cancellation is fully retained.</text>
</svg>
