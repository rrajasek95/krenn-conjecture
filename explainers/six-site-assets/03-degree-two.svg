<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="03-degree-two-title 03-degree-two-desc">
<title id="03-degree-two-title">Two neighbors force the remaining triangle to vanish</title>
<desc id="03-degree-two-desc">In one color, p has precisely neighbors r and s with weights a and b. For q among the other three vertices, the off-diagonal cofactor identity gives zero equals 2ab times the edge weight between the other two vertices. Varying q kills every edge in that triangle.</desc>
<rect width="1000" height="100%" rx="16" fill="#fff"/>
<text x="30" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / 03</text>
<text x="30" y="66" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Two neighbors force the remaining triangle to vanish</text>
<rect x="30" y="104" width="430" height="303" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<line x1="245" y1="154" x2="117" y2="231" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="245" y1="154" x2="373" y2="231" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<circle cx="245" cy="154" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="245" y="160" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">p</text>
<circle cx="117" cy="231" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="117" y="237" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">r</text>
<circle cx="373" cy="231" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="373" y="237" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">s</text>
<circle cx="115" cy="347" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="115" y="353" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">q</text>
<circle cx="245" cy="298" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="245" y="304" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">u</text>
<circle cx="374" cy="347" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="374" y="353" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">v</text>
<text x="166" y="175" font-family="system-ui, sans-serif" font-size="17" fill="#bd3847" text-anchor="middle" font-weight="650">a ≠ 0</text>
<text x="325" y="175" font-family="system-ui, sans-serif" font-size="17" fill="#bd3847" text-anchor="middle" font-weight="650">b ≠ 0</text>
<line x1="115" y1="347" x2="245" y2="298" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5" opacity="1"/>
<rect x="167" y="307.5" width="26" height="28" rx="4" fill="white" stroke="white"/>
<text x="180" y="328.5" font-family="system-ui, sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="700">0</text>
<line x1="245" y1="298" x2="374" y2="347" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5" opacity="1"/>
<rect x="296.5" y="307.5" width="26" height="28" rx="4" fill="white" stroke="white"/>
<text x="309.5" y="328.5" font-family="system-ui, sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="700">0</text>
<line x1="115" y1="347" x2="374" y2="347" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5" opacity="1"/>
<rect x="231.5" y="332" width="26" height="28" rx="4" fill="white" stroke="white"/>
<text x="244.5" y="353" font-family="system-ui, sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="700">0</text>
<circle cx="115" cy="347" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="115" y="353" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">q</text>
<circle cx="245" cy="298" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="245" y="304" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">u</text>
<circle cx="374" cy="347" r="17" fill="white" stroke="#202d3a" stroke-width="2.5"/>
<text x="374" y="353" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">v</text>
<text x="245" y="390" font-family="system-ui, sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">E = {q,u,v}: all internal weights become zero</text>
<text x="500" y="142" font-family="system-ui, sans-serif" font-size="21" fill="#202d3a" text-anchor="start" font-weight="650">Delete r,q:  p must pair with s</text>
<text x="500" y="180" font-family="system-ui, sans-serif" font-size="23" fill="#202d3a" text-anchor="start" font-weight="400">C[r,q] = b M[u,v]</text>
<text x="500" y="225" font-family="system-ui, sans-serif" font-size="21" fill="#202d3a" text-anchor="start" font-weight="650">Delete s,q:  p must pair with r</text>
<text x="500" y="263" font-family="system-ui, sans-serif" font-size="23" fill="#202d3a" text-anchor="start" font-weight="400">C[s,q] = a M[u,v]</text>
<rect x="490" y="292" width="480" height="101" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="730" y="333" font-family="system-ui, sans-serif" font-size="22" fill="#202d3a" text-anchor="middle" font-weight="400">0 = a·b M[u,v] + b·a M[u,v]</text>
<text x="730" y="372" font-family="system-ui, sans-serif" font-size="22" fill="#bd3847" text-anchor="middle" font-weight="650">0 = 2ab M[u,v]   ⇒   M[u,v] = 0</text>
<text x="500" y="441" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Every full matching needs an edge inside E, so its product is zero. The pure amplitude vanishes.</text>
</svg>
