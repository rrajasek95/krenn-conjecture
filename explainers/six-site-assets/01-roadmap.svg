<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="01-roadmap-title 01-roadmap-desc">
<title id="01-roadmap-title">The short proof: structure leaves nowhere for cancellation to hide</title>
<desc id="01-roadmap-desc">Two imported structural lemmas imply color degree at most two. The inverse-cofactor identity excludes degree two, leaving one perfect matching per color. Those matchings force a mixed output with exactly one nonzero term. An older certificate proof is independent.</desc>
<rect width="1000" height="100%" rx="16" fill="#fff"/>
<text x="30" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / 01</text>
<text x="30" y="66" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">The short proof: structure leaves nowhere for cancellation to hide</text>
<rect x="30" y="110" width="205" height="174" rx="12" fill="#edf4fc" stroke="#d8dedf"/>
<text x="45" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#526171" text-anchor="start" font-weight="700">INPUTS A + B</text>
<text x="45" y="180" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Diagonal edges</text>
<text x="45" y="211" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Inverse cofactors</text>
<text x="45" y="242" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="600">Zero neighborhood blocks</text>
<line x1="244" y1="200" x2="265" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="257" y1="195" x2="265" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="257" y1="205" x2="265" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<rect x="275" y="110" width="205" height="174" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="290" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#526171" text-anchor="start" font-weight="700">LINEAR ALGEBRA</text>
<text x="290" y="180" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Six rows, six columns</text>
<text x="290" y="211" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Degree ≤ 2</text>
<text x="290" y="242" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="600">Degree 2 is impossible</text>
<line x1="489" y1="200" x2="510" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="502" y1="195" x2="510" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="502" y1="205" x2="510" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<rect x="520" y="110" width="205" height="174" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="535" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#526171" text-anchor="start" font-weight="700">GRAPH THEORY</text>
<text x="535" y="180" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Each color is a matching</text>
<text x="535" y="211" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="start" font-weight="400">Colors cannot share pairs</text>
<text x="535" y="242" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="600">Red + blue form a cycle</text>
<line x1="734" y1="200" x2="755" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="747" y1="195" x2="755" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="747" y1="205" x2="755" y2="200" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<rect x="765" y="110" width="205" height="174" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="780" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#526171" text-anchor="start" font-weight="700">CONTRADICTION</text>
<text x="780" y="180" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Green must cross</text>
<text x="780" y="211" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">One mixed output</text>
<text x="780" y="242" font-family="system-ui, sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="600">One nonzero product</text>
<text x="500" y="327" font-family="system-ui, sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">The lemmas are the hard inputs; the six-site deduction is worked out below.</text>
<text x="500" y="365" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Separate earlier route: rank-one blocks → 19 defect graphs → exact certificates.</text>
</svg>
