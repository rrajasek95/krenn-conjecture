<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="04-forced-mixed-title 04-forced-mixed-desc">
<title id="04-forced-mixed-title">A green crossing forces one mixed output with no cancellation</title>
<desc id="04-forced-mixed-desc">Red edges 12,34,56 and blue edges 23,45,61 form an alternating six-cycle. Its shores are 1,3,5 and 2,4,6. A green perfect matching must cross these odd shores. After relabeling, choose green 14. Together with blue 23 and red 56 this gives GBBGRR.</desc>
