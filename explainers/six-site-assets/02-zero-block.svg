<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" role="img" aria-labelledby="02-zero-block-title 02-zero-block-desc">
<title id="02-zero-block-title">Too many neighbors would make the cofactor matrix singular</title>
<desc id="02-zero-block-desc">If p had three red neighbors u,v,w, its closed neighborhood S would have four vertices. The four corresponding rows of the blue cofactor would be zero in the four S columns, leaving only two columns for four independent rows. This contradicts invertibility.</desc>
