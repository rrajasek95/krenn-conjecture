<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 399" role="img" aria-labelledby="05-diagonal-reduction-title 05-diagonal-reduction-desc">
<title id="05-diagonal-reduction-title">The new reduction removes six coefficients per pair</title>
<desc id="05-diagonal-reduction-desc">A general 3 by 3 endpoint-color block can have nine entries. The internally reviewed theorem forces its off-diagonal entries to zero in the original target basis, leaving RR, BB, GG. Across all site pairs these form three n by n scalar matrices, one per color.</desc>
