<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-labelledby="07-degree-frontier-title 07-degree-frontier-desc">
<title id="07-degree-frontier-title">Why six and eight collapse, ten needs more, and twelve remains</title>
<desc id="07-degree-frontier-desc">The internally reviewed color-degree bound is one through n/2 minus two. Degree two is forbidden and degree one lies in an isolated edge. At six and eight sites only degree one remains. At ten, degrees one and three remain and a separate theorem excludes cubic components. At twelve, degrees one, three, and four remain; general exclusion is open.</desc>
<rect width="1000" height="100%" rx="16" fill="#fff"/>
<text x="30" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / 07</text>
<text x="30" y="66" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Why six and eight collapse, ten needs more, and twelve remains</text>
<rect x="30" y="104" width="220" height="203" rx="12" fill="#f2f6f7" stroke="#d8dedf"/>
<text x="140" y="139" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="700">n = 6</text>
<text x="140" y="169" font-family="system-ui, sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">Degree at most 1</text>
<text x="140" y="202" font-family="system-ui, sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Allowed: {1}</text>
<text x="140" y="231" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">Every color is a matching.</text>
<text x="140" y="267" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">One-matching-color</text>
<text x="140" y="289" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">theorem gives contradiction.</text>
<rect x="270" y="104" width="220" height="203" rx="12" fill="#f2f6f7" stroke="#d8dedf"/>
<text x="380" y="139" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="700">n = 8</text>
<text x="380" y="169" font-family="system-ui, sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">Degree at most 2</text>
<text x="380" y="202" font-family="system-ui, sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Allowed: {1}</text>
<text x="380" y="231" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">Degree 2 is forbidden.</text>
<text x="380" y="267" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">Again every color</text>
<text x="380" y="289" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">would be a matching.</text>
<rect x="510" y="104" width="220" height="203" rx="12" fill="#f2f6f7" stroke="#d8dedf"/>
<text x="620" y="139" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="700">n = 10</text>
<text x="620" y="169" font-family="system-ui, sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">Degree at most 3</text>
<text x="620" y="202" font-family="system-ui, sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Allowed: {1, 3}</text>
<text x="620" y="231" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">Cubic components remain.</text>
<text x="620" y="267" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">A separate analytic proof</text>
<text x="620" y="289" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">excludes these too.</text>
<rect x="750" y="104" width="220" height="203" rx="12" fill="#fff8ec" stroke="#d6ac60"/>
<text x="860" y="139" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="700">n = 12</text>
<text x="860" y="169" font-family="system-ui, sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">Degree at most 4</text>
<text x="860" y="202" font-family="system-ui, sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Allowed: {1, 3, 4}</text>
<text x="860" y="231" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">More components possible.</text>
<text x="860" y="267" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">No general contradiction</text>
<text x="860" y="289" font-family="system-ui, sans-serif" font-size="14" fill="#202d3a" text-anchor="middle" font-weight="400">has been established.</text>
<text x="500" y="332" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">These are consequences of the internally reviewed chain; the full conjecture stays open.</text>
</svg>
