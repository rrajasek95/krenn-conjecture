<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="04-cancellation-title 04-cancellation-desc">
<title id="04-cancellation-title">Two matchings can cancel in the same output</title>
<desc id="04-cancellation-desc">Two all-red matchings on four sites have weights plus one and minus one. They both produce RRRR, so that amplitude is zero. This is a scalar cancellation example, not a full GHZ solution.</desc>
<rect width="1000" height="100%" rx="16" fill="#fff"/>
<text x="30" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / 04</text>
<text x="30" y="66" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Two matchings can cancel in the same output</text>
<rect x="30" y="95" width="275" height="222" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="167" y="127" font-family="system-ui, sans-serif" font-size="18" fill="#202d3a" text-anchor="middle" font-weight="650">Matching 12 / 34</text>
<line x1="90" y1="159" x2="245" y2="159" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="245" y1="239" x2="90" y2="239" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<circle cx="90" cy="159" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="90" y="165" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="245" cy="159" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="245" y="165" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="245" cy="239" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="245" y="245" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="90" cy="239" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="90" y="245" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="167" y="288" font-family="system-ui, sans-serif" font-size="19" fill="#bd3847" text-anchor="middle" font-weight="650">+1 × +1 = +1</text>
<rect x="350" y="95" width="275" height="222" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="487" y="127" font-family="system-ui, sans-serif" font-size="18" fill="#202d3a" text-anchor="middle" font-weight="650">Matching 13 / 24</text>
<line x1="410" y1="159" x2="565" y2="239" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="565" y1="159" x2="410" y2="239" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<circle cx="410" cy="159" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="410" y="165" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="565" cy="159" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="565" y="165" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="565" cy="239" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="565" y="245" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="410" cy="239" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="410" y="245" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="487" y="288" font-family="system-ui, sans-serif" font-size="19" fill="#bd3847" text-anchor="middle" font-weight="650">+1 × −1 = −1</text>
<text x="330" y="215" font-family="system-ui, sans-serif" font-size="28" fill="#202d3a" text-anchor="middle" font-weight="400">+</text>
<line x1="645" y1="207" x2="698" y2="207" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="690" y1="202" x2="698" y2="207" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="690" y1="212" x2="698" y2="207" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<text x="818" y="144" font-family="system-ui, sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Same output: RRRR</text>
<text x="818" y="211" font-family="system-ui, sans-serif" font-size="29" fill="#bd3847" text-anchor="middle" font-weight="700">1 + (−1) = 0</text>
<text x="818" y="262" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Two terms. Zero amplitude.</text>
<text x="500" y="343" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Weights: w₁₂ = w₃₄ = w₁₃ = 1, w₂₄ = −1; the other edges are absent.</text>
</svg>
