<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="03-third-color-leak-title 03-third-color-leak-desc">
<title id="03-third-color-leak-title">Adding a third color creates new mixed pairings</title>
<desc id="03-third-color-leak-desc">The six-cycle has two pure matchings. Adding green edges 14, 25, 36 gives six matchings: three pure and three mixed. The highlighted matching 12 red, 36 green, 45 blue gives RRGBBG with amplitude one.</desc>
