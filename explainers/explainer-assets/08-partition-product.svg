<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 414" role="img" aria-labelledby="08-partition-product-title 08-partition-product-desc">
<title id="08-partition-product-title">After the reduction, every mixed output is a product of sums</title>
<desc id="08-partition-product-desc">For an illustrative eight-site partition, sites 1,2,3,4 are red; 5,6 are blue; 7,8 are green. The red hafnian has three terms, while the blue and green factors are single edges. Their product is the output amplitude. Every mixed partition of a full target must have at least one zero factor.</desc>
<rect width="1000" height="100%" rx="16" fill="#fff"/>
<text x="30" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / 08</text>
<text x="30" y="66" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">After the reduction, every mixed output is a product of sums</text>
<rect x="30" y="105" width="411" height="204" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="235.5" y="139" font-family="system-ui, sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="650">R = {1, 2, 3, 4}</text>
<rect x="465" y="105" width="234" height="204" rx="12" fill="#edf4fc" stroke="#d8dedf"/>
<text x="582" y="139" font-family="system-ui, sans-serif" font-size="20" fill="#2168af" text-anchor="middle" font-weight="650">B = {5, 6}</text>
<rect x="725" y="105" width="245" height="204" rx="12" fill="#edf7f1" stroke="#d8dedf"/>
<text x="847.5" y="139" font-family="system-ui, sans-serif" font-size="20" fill="#237953" text-anchor="middle" font-weight="650">G = {7, 8}</text>
<line x1="129" y1="178" x2="329" y2="178" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="129" y1="178" x2="329" y2="243" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="129" y1="178" x2="129" y2="243" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="329" y1="178" x2="329" y2="243" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="329" y1="178" x2="129" y2="243" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="329" y1="243" x2="129" y2="243" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<circle cx="129" cy="178" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="129" y="184" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="329" cy="178" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="329" y="184" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="329" cy="243" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="329" y="249" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="129" cy="243" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="129" y="249" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<line x1="513" y1="206" x2="651" y2="206" stroke="#2168af" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 5" opacity="1"/>
<circle cx="513" cy="206" r="17" fill="white" stroke="#2168af" stroke-width="2.5"/>
<text x="513" y="212" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">5</text>
<circle cx="651" cy="206" r="17" fill="white" stroke="#2168af" stroke-width="2.5"/>
<text x="651" y="212" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">6</text>
<line x1="776" y1="206" x2="921" y2="206" stroke="#237953" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" opacity="1"/>
<circle cx="776" cy="206" r="17" fill="white" stroke="#237953" stroke-width="2.5"/>
<text x="776" y="212" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">7</text>
<circle cx="921" cy="206" r="17" fill="white" stroke="#237953" stroke-width="2.5"/>
<text x="921" y="212" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">8</text>
<text x="235" y="291" font-family="system-ui, sans-serif" font-size="19" fill="#bd3847" text-anchor="middle" font-weight="650">R₁₂R₃₄ + R₁₃R₂₄ + R₁₄R₂₃</text>
<text x="582" y="291" font-family="system-ui, sans-serif" font-size="23" fill="#2168af" text-anchor="middle" font-weight="650">B₅₆</text>
<text x="847" y="291" font-family="system-ui, sans-serif" font-size="23" fill="#237953" text-anchor="middle" font-weight="650">G₇₈</text>
<text x="453" y="292" font-family="system-ui, sans-serif" font-size="23" fill="#202d3a" text-anchor="middle" font-weight="400">×</text>
<text x="711" y="292" font-family="system-ui, sans-serif" font-size="23" fill="#202d3a" text-anchor="middle" font-weight="400">×</text>
<text x="500" y="354" font-family="system-ui, sans-serif" font-size="22" fill="#202d3a" text-anchor="middle" font-weight="650">Amplitude = haf(Mᴿ[R]) × haf(Mᴮ[B]) × haf(Mᴳ[G])</text>
<text x="500" y="392" font-family="system-ui, sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="400">At least one factor must vanish for every mixed partition. Cancellation can occur inside a factor.</text>
</svg>
