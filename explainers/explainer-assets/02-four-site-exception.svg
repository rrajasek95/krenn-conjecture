<title id="02-four-site-exception-title">Four sites: the three pairings are exactly the three targets</title>
<desc id="02-four-site-exception-desc">The red matching is 12 and 34; the blue matching is 13 and 24; the green matching is 14 and 23. These are all perfect matchings of K4. Unit weights give RRRR, BBBB, GGGG, each with amplitude one.</desc>
