<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="06-cofactor-title 06-cofactor-desc">
<title id="06-cofactor-title">A cofactor sums the matchings left after deleting two sites</title>
<desc id="06-cofactor-desc">Delete sites 1 and 2 from a six-site scalar weighted graph. The remaining sites 3,4,5,6 have three possible pairings. Their sum is C[1,2] = w34 w56 + w35 w46 + w36 w45. Only under the full-source hypotheses does the additional identity MC = tau I follow.</desc>
