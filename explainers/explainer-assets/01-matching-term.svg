<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="01-matching-term-title 01-matching-term-desc">
<title id="01-matching-term-title">A matching is one term in an output amplitude</title>
<desc id="01-matching-term-desc">Six sites are paired as 12 red, 36 green, and 45 blue. With edge weights 2, minus 1, and 3, this matching contributes minus 6 to the output RRGBBG. The output amplitude adds all matchings producing that same word.</desc>
<rect width="1000" height="100%" rx="16" fill="#fff"/>
<text x="30" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / 01</text>
<text x="30" y="66" font-family="system-ui, sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">A matching is one term in an output amplitude</text>
<rect x="30" y="95" width="280" height="242" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<line x1="170" y1="131" x2="245.344" y2="174.5" stroke="#bd3847" stroke-width="4" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="245.344" y1="261.5" x2="94.6558" y2="174.5" stroke="#237953" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" opacity="1"/>
<line x1="170" y1="305" x2="94.6558" y2="261.5" stroke="#2168af" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 5" opacity="1"/>
<circle cx="170" cy="131" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="170" y="137" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="245.344" cy="174.5" r="17" fill="white" stroke="#bd3847" stroke-width="2.5"/>
<text x="245.344" y="180.5" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="245.344" cy="261.5" r="17" fill="white" stroke="#237953" stroke-width="2.5"/>
<text x="245.344" y="267.5" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="170" cy="305" r="17" fill="white" stroke="#2168af" stroke-width="2.5"/>
<text x="170" y="311" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<circle cx="94.6558" cy="261.5" r="17" fill="white" stroke="#2168af" stroke-width="2.5"/>
<text x="94.6558" y="267.5" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">5</text>
<circle cx="94.6558" cy="174.5" r="17" fill="white" stroke="#237953" stroke-width="2.5"/>
<text x="94.6558" y="180.5" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="middle" font-weight="650">6</text>
<text x="214" y="154" font-family="system-ui, sans-serif" font-size="15" fill="#bd3847" text-anchor="start" font-weight="650">R · 2</text>
<text x="164" y="191" font-family="system-ui, sans-serif" font-size="15" fill="#237953" text-anchor="start" font-weight="650">G · −1</text>
<text x="92" y="302" font-family="system-ui, sans-serif" font-size="15" fill="#2168af" text-anchor="start" font-weight="650">B · 3</text>
<line x1="327" y1="216" x2="366" y2="216" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="358" y1="211" x2="366" y2="216" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="358" y1="221" x2="366" y2="216" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<text x="390" y="143" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Read vertices 1 → 6</text>
<text x="406" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">1</text>
<text x="445" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">2</text>
<text x="484" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">3</text>
<text x="523" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">4</text>
<text x="562" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">5</text>
<text x="601" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#526171" text-anchor="middle" font-weight="400">6</text>
<rect x="390" y="195" width="32" height="36" rx="6" fill="#fcf0f1" stroke="#bd3847"/>
<text x="406" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="700">R</text>
<rect x="429" y="195" width="32" height="36" rx="6" fill="#fcf0f1" stroke="#bd3847"/>
<text x="445" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="700">R</text>
<rect x="468" y="195" width="32" height="36" rx="6" fill="#edf7f1" stroke="#237953"/>
<text x="484" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#237953" text-anchor="middle" font-weight="700">G</text>
<rect x="507" y="195" width="32" height="36" rx="6" fill="#edf4fc" stroke="#2168af"/>
<text x="523" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#2168af" text-anchor="middle" font-weight="700">B</text>
<rect x="546" y="195" width="32" height="36" rx="6" fill="#edf4fc" stroke="#2168af"/>
<text x="562" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#2168af" text-anchor="middle" font-weight="700">B</text>
<rect x="585" y="195" width="32" height="36" rx="6" fill="#edf7f1" stroke="#237953"/>
<text x="601" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#237953" text-anchor="middle" font-weight="700">G</text>
<text x="390" y="270" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="start" font-weight="400">One mixed color list</text>
<line x1="635" y1="216" x2="675" y2="216" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="667" y1="211" x2="675" y2="216" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<line x1="667" y1="221" x2="675" y2="216" stroke="#526171" stroke-width="2" stroke-linecap="round" stroke-dasharray="" opacity="1"/>
<text x="705" y="144" font-family="system-ui, sans-serif" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Multiply within a matching</text>
<text x="705" y="206" font-family="system-ui, sans-serif" font-size="23" fill="#202d3a" text-anchor="start" font-weight="700">2 × (−1) × 3 = −6</text>
<text x="705" y="254" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="start" font-weight="400">Then add contributions from</text>
<text x="705" y="280" font-family="system-ui, sans-serif" font-size="17" fill="#202d3a" text-anchor="start" font-weight="400">all matchings with this list.</text>
</svg>
