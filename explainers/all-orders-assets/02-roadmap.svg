<line x1="666" y1="188" x2="674" y2="183" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="666" y1="178" x2="674" y2="183" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="825" y1="265" x2="825" y2="295" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="820" y1="287" x2="825" y2="295" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="830" y1="287" x2="825" y2="295" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="674" y1="378" x2="651" y2="378" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="659" y1="373" x2="651" y2="378" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="659" y1="383" x2="651" y2="378" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="349" y1="378" x2="326" y2="378" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="334" y1="373" x2="326" y2="378" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="334" y1="383" x2="326" y2="378" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
</svg>
