<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="02-roadmap-title 02-roadmap-desc">
<title id="02-roadmap-title">The proof makes cancellation impossible</title>
<desc id="02-roadmap-desc">Six steps in order: exact target, higher-response identities, same-color edges, the new endpoint identity, one edge per vertex per color, and a mixed matching with nonzero amplitude. Arrows run across the top row, down, then back along the bottom row.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">The proof makes cancellation impossible</text>
<rect x="30" y="110" width="290" height="145" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="45" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">1 / ASSUMPTION</text>
<text x="45" y="173" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="start" font-weight="700">Exact target output</text>
<text x="45" y="206" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Three nonzero pure amplitudes</text>
<text x="45" y="231" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Every mixed amplitude is zero</text>
<rect x="355" y="110" width="290" height="145" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="370" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">2 / TWO FORMAL COPIES</text>
<text x="370" y="173" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="start" font-weight="700">Higher responses vanish</text>
<text x="370" y="206" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">On every two-color palette</text>
<text x="370" y="231" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Including the terminal degree</text>
<rect x="680" y="110" width="290" height="145" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="695" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">3 / MATRIX INVERSES</text>
<text x="695" y="173" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="start" font-weight="700">Edges have one color</text>
<text x="695" y="206" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Both endpoints agree</text>
<text x="695" y="231" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Derived in the original basis</text>
<rect x="680" y="305" width="290" height="145" rx="12" fill="#edf7f1" stroke="#d8dedf"/>
<text x="695" y="333" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">4 / NEW CLOSING STEP</text>
<text x="695" y="368" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="start" font-weight="700">The endpoint identity</text>
<text x="695" y="401" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Every supported edge contributes</text>
<text x="695" y="426" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">the entire pure amplitude β</text>
<rect x="355" y="305" width="290" height="145" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="370" y="333" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">5 / COUNT AT A VERTEX</text>
<text x="370" y="368" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="start" font-weight="700">One edge per color</text>
<text x="370" y="401" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">β = kβ, with β nonzero</text>
<text x="370" y="426" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Therefore k = 1</text>
<rect x="30" y="305" width="290" height="145" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="45" y="333" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">6 / GRAPH CONTRADICTION</text>
<text x="45" y="368" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="start" font-weight="700">An unwanted output</text>
<text x="45" y="401" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Three matchings force a mixed one</text>
<text x="45" y="426" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="start" font-weight="400">Its nonzero product cannot cancel</text>
<line x1="326" y1="183" x2="349" y2="183" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="341" y1="188" x2="349" y2="183" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="341" y1="178" x2="349" y2="183" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
