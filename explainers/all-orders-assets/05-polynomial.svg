<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" role="img" aria-labelledby="05-polynomial-title 05-polynomial-desc">
<title id="05-polynomial-title">A finite polynomial cannot hide its highest power</title>
<desc id="05-polynomial-desc">For b with leading term u z to the k, d b has coefficient d u at degree k and b prime has coefficient zero there. With d and u nonzero, the equation b prime plus d b equals zero is impossible. Nonzero constants fail as well.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">A finite polynomial cannot hide its highest power</text>
<text x="500" y="120" font-family="system-ui,sans-serif" font-size="21" fill="#202d3a" text-anchor="middle" font-weight="400">Assume b(z) = u zᵏ + lower powers, with u ≠ 0 and k ≥ 1.</text>
<text x="455" y="170" font-family="system-ui,sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="650">coefficient of zᵏ</text>
<text x="650" y="170" font-family="system-ui,sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="650">coefficient of zᵏ⁻¹</text>
<text x="835" y="170" font-family="system-ui,sans-serif" font-size="16" fill="#526171" text-anchor="middle" font-weight="650">lower powers</text>
<rect x="30" y="189" width="940" height="55" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="52" y="224" font-family="system-ui,sans-serif" font-size="22" fill="#202d3a" text-anchor="start" font-weight="650">Differentiate: b′</text>
<text x="455" y="224" font-family="system-ui,sans-serif" font-size="25" fill="#bd3847" text-anchor="middle" font-weight="650">0</text>
<text x="650" y="224" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="650">ku</text>
<text x="835" y="224" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="650">…</text>
<rect x="30" y="256" width="940" height="55" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="52" y="291" font-family="system-ui,sans-serif" font-size="22" fill="#202d3a" text-anchor="start" font-weight="650">Multiply: db</text>
<text x="455" y="291" font-family="system-ui,sans-serif" font-size="25" fill="#bd3847" text-anchor="middle" font-weight="650">du ≠ 0</text>
<text x="650" y="291" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="650">∗</text>
<text x="835" y="291" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="650">…</text>
<rect x="30" y="323" width="940" height="55" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="52" y="358" font-family="system-ui,sans-serif" font-size="22" fill="#202d3a" text-anchor="start" font-weight="650">Add: b′ + db</text>
<text x="455" y="358" font-family="system-ui,sans-serif" font-size="25" fill="#bd3847" text-anchor="middle" font-weight="650">du ≠ 0</text>
<text x="650" y="358" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="650">∗</text>
<text x="835" y="358" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="middle" font-weight="650">…</text>
<text x="500" y="416" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">For k = 0: b′ = 0 and db ≠ 0. Thus the only polynomial solution is b = 0.</text>
</svg>
