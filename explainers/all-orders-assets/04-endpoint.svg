<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="04-endpoint-title 04-endpoint-desc">
<title id="04-endpoint-title">Each supported edge accounts for the whole amplitude</title>
<desc id="04-endpoint-desc">Condition on an edge pq of weight d. Its contribution is d times the retained hafnian alpha. The new identity makes this beta. Three supported edges at p would therefore give beta equals three beta, impossible when beta is nonzero.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Each supported edge accounts for the whole amplitude</text>
<rect x="30" y="108" width="455" height="342" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="257" y="143" font-family="system-ui,sans-serif" font-size="21" fill="#202d3a" text-anchor="middle" font-weight="650">One supported edge pq</text>
<line x1="130" y1="199" x2="380" y2="199" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="130" cy="199" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="130" y="204" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">p</text>
<circle cx="380" cy="199" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="380" y="204" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">q</text>
<text x="255" y="184" font-family="system-ui,sans-serif" font-size="17" fill="#bd3847" text-anchor="middle" font-weight="400">weight d ≠ 0</text>
<line x1="160" y1="270" x2="350" y2="270" stroke="#d8dedf" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="160" y1="270" x2="350" y2="358" stroke="#d8dedf" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="160" y1="270" x2="160" y2="358" stroke="#d8dedf" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="350" y1="270" x2="350" y2="358" stroke="#d8dedf" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="350" y1="270" x2="160" y2="358" stroke="#d8dedf" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="350" y1="358" x2="160" y2="358" stroke="#d8dedf" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="160" cy="270" r="16" fill="white" stroke="#526171" stroke-width="2"/>
<text x="160" y="275" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="350" cy="270" r="16" fill="white" stroke="#526171" stroke-width="2"/>
<text x="350" y="275" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="350" cy="358" r="16" fill="white" stroke="#526171" stroke-width="2"/>
<text x="350" y="363" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="160" cy="358" r="16" fill="white" stroke="#526171" stroke-width="2"/>
<text x="160" y="363" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="257" y="395" font-family="system-ui,sans-serif" font-size="19" fill="#526171" text-anchor="middle" font-weight="400">Retained matching sum: α</text>
<text x="257" y="431" font-family="system-ui,sans-serif" font-size="23" fill="#bd3847" text-anchor="middle" font-weight="700">Its contribution: dα = β</text>
<rect x="515" y="108" width="455" height="342" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="742" y="143" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Suppose p had three such edges</text>
<line x1="605" y1="265" x2="862" y2="196" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="605" y1="265" x2="862" y2="265" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="605" y1="265" x2="862" y2="334" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="605" cy="265" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="605" y="270" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">p</text>
<circle cx="862" cy="196" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="862" y="201" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">q₁</text>
<circle cx="862" cy="265" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="862" y="270" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">q₂</text>
<circle cx="862" cy="334" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="862" y="339" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">q₃</text>
<rect x="715" y="183" width="44" height="31" rx="12" fill="white" stroke="#d8dedf"/>
<text x="737" y="205" font-family="system-ui,sans-serif" font-size="21" fill="#bd3847" text-anchor="middle" font-weight="700">β</text>
<rect x="715" y="237" width="44" height="31" rx="12" fill="white" stroke="#d8dedf"/>
<text x="737" y="259" font-family="system-ui,sans-serif" font-size="21" fill="#bd3847" text-anchor="middle" font-weight="700">β</text>
<rect x="715" y="293" width="44" height="31" rx="12" fill="white" stroke="#d8dedf"/>
<text x="737" y="315" font-family="system-ui,sans-serif" font-size="21" fill="#bd3847" text-anchor="middle" font-weight="700">β</text>
<text x="742" y="393" font-family="system-ui,sans-serif" font-size="22" fill="#202d3a" text-anchor="middle" font-weight="650">β = β + β + β is impossible</text>
<text x="742" y="426" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Exactly one supported edge can remain.</text>
<text x="500" y="487" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">The equality is derived from the exact target assumptions, not from positivity.</text>
</svg>
