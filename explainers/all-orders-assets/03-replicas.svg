<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" role="img" aria-labelledby="03-replicas-title 03-replicas-desc">
<title id="03-replicas-title">Two copies give a symmetry of the same calculation</title>
<desc id="03-replicas-desc">Two formal copies share identical pairing rules. Orthogonal mixing preserves those rules. A local two-color determinant changes sign under reflection. With an odd number of sites the total changes sign and must vanish; with an even number it remains invariant.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Two copies give a symmetry of the same calculation</text>
<rect x="30" y="108" width="300" height="175" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="180" y="142" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">Identical pairing rules</text>
<text x="180" y="192" font-family="system-ui,sans-serif" font-size="24" fill="#bd3847" text-anchor="middle" font-weight="400">Copy 1: X, g₁</text>
<text x="180" y="239" font-family="system-ui,sans-serif" font-size="24" fill="#2168af" text-anchor="middle" font-weight="400">Copy 2: Y, g₂</text>
<line x1="347" y1="195" x2="416" y2="195" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="408" y1="200" x2="416" y2="195" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="408" y1="190" x2="416" y2="195" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<text x="382" y="173" font-family="system-ui,sans-serif" font-size="15" fill="#526171" text-anchor="middle" font-weight="400">mix</text>
<rect x="435" y="108" width="535" height="175" rx="12" fill="#edf4fc" stroke="#d8dedf"/>
<text x="702" y="145" font-family="system-ui,sans-serif" font-size="20" fill="#202d3a" text-anchor="middle" font-weight="650">A determinant at each retained site</text>
<text x="702" y="193" font-family="system-ui,sans-serif" font-size="29" fill="#202d3a" text-anchor="middle" font-weight="400">Xᵣ Yᵦ − Xᵦ Yᵣ</text>
<text x="702" y="239" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">Rotation: unchanged   ·   Reflection: sign flips</text>
<rect x="30" y="315" width="455" height="128" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="257" y="343" font-family="system-ui,sans-serif" font-size="13" fill="#526171" text-anchor="middle" font-weight="700">ODD NUMBER OF SITES</text>
<text x="257" y="383" font-family="system-ui,sans-serif" font-size="24" fill="#202d3a" text-anchor="middle" font-weight="650">S = −S  ⇒  S = 0</text>
<text x="257" y="417" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Gives higher-response identities</text>
<rect x="515" y="315" width="455" height="128" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="742" y="343" font-family="system-ui,sans-serif" font-size="13" fill="#526171" text-anchor="middle" font-weight="700">EVEN NUMBER OF SITES</text>
<text x="742" y="383" font-family="system-ui,sans-serif" font-size="24" fill="#202d3a" text-anchor="middle" font-weight="650">S stays unchanged</text>
<text x="742" y="417" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Constrains the endpoint matrix</text>
</svg>
