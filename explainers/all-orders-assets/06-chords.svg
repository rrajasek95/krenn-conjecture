<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="06-chords-title 06-chords-desc">
<title id="06-chords-title">Interlacing chords leave even paths to pair</title>
<desc id="06-chords-desc">On an eight-cycle the third-color chords 0–4 and 1–5 interlace. Removing their endpoints leaves paths 2–3 and 6–7 and two empty paths. The two chords and two remaining cycle edges form a mixed perfect matching, producing GGRRGGRR.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Interlacing chords leave even paths to pair</text>
<rect x="30" y="105" width="455" height="310" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="257" y="139" font-family="system-ui,sans-serif" font-size="19" fill="#202d3a" text-anchor="middle" font-weight="650">Two opposite-parity chord types</text>
<line x1="257" y1="171" x2="322.761" y2="198.239" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="322.761" y1="198.239" x2="350" y2="264" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="350" y1="264" x2="322.761" y2="329.761" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="322.761" y1="329.761" x2="257" y2="357" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="257" y1="357" x2="191.239" y2="329.761" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="191.239" y1="329.761" x2="164" y2="264" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="164" y1="264" x2="191.239" y2="198.239" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="191.239" y1="198.239" x2="257" y2="171" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="257" y1="171" x2="257" y2="357" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
<line x1="322.761" y1="198.239" x2="191.239" y2="329.761" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="257" cy="171" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="257" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">0</text>
<circle cx="322.761" cy="198.239" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="322.761" y="203.239" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="350" cy="264" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="350" y="269" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="322.761" cy="329.761" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="322.761" y="334.761" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="257" cy="357" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="257" y="362" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<circle cx="191.239" cy="329.761" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="191.239" y="334.761" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">5</text>
<circle cx="164" cy="264" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="164" y="269" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">6</text>
<circle cx="191.239" cy="198.239" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="191.239" y="203.239" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">7</text>
<text x="257" y="393" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Green: 0–4 (even) and 1–5 (odd)</text>
<rect x="515" y="105" width="455" height="310" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="742" y="139" font-family="system-ui,sans-serif" font-size="19" fill="#202d3a" text-anchor="middle" font-weight="650">Complete the matching on the paths</text>
<line x1="742" y1="171" x2="807.761" y2="198.239" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="807.761" y1="198.239" x2="835" y2="264" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="835" y1="264" x2="807.761" y2="329.761" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="807.761" y1="329.761" x2="742" y2="357" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="742" y1="357" x2="676.239" y2="329.761" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="676.239" y1="329.761" x2="649" y2="264" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="649" y1="264" x2="676.239" y2="198.239" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="676.239" y1="198.239" x2="742" y2="171" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="742" y1="171" x2="742" y2="357" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
<line x1="807.761" y1="198.239" x2="676.239" y2="329.761" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="742" cy="171" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="742" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">0</text>
<circle cx="807.761" cy="198.239" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="807.761" y="203.239" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="835" cy="264" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="835" y="269" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="807.761" cy="329.761" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="807.761" y="334.761" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="742" cy="357" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="742" y="362" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<circle cx="676.239" cy="329.761" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="676.239" y="334.761" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">5</text>
<circle cx="649" cy="264" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="649" y="269" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">6</text>
<circle cx="676.239" cy="198.239" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="676.239" y="203.239" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">7</text>
<text x="742" y="393" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Green 0–4, 1–5; red 2–3, 6–7</text>
<text x="500" y="454" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">The resulting color list GGRRGGRR has one nonzero matching contribution.</text>
</svg>
