<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="01-cancellation-title 01-cancellation-desc">
<title id="01-cancellation-title">Finding a mixed matching is not enough</title>
<desc id="01-cancellation-desc">Two different red pairings of four vertices have contributions plus one and minus one to the same pure output. Their sum is zero. The same cancellation principle is the obstacle when ruling out mixed outputs.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Finding a mixed matching is not enough</text>
<rect x="30" y="105" width="280" height="220" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="170" y="137" font-family="system-ui,sans-serif" font-size="19" fill="#202d3a" text-anchor="middle" font-weight="650">Pair 12 and 34</text>
<line x1="85" y1="175" x2="255" y2="175" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="255" y1="265" x2="85" y2="265" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="85" cy="175" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="85" y="180" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="255" cy="175" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="255" y="180" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="255" cy="265" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="255" y="270" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="85" cy="265" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="85" y="270" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="170" y="305" font-family="system-ui,sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="650">+1 × +1 = +1</text>
<rect x="350" y="105" width="280" height="220" rx="12" fill="#fcf0f1" stroke="#d8dedf"/>
<text x="490" y="137" font-family="system-ui,sans-serif" font-size="19" fill="#202d3a" text-anchor="middle" font-weight="650">Pair 13 and 24</text>
<line x1="405" y1="175" x2="575" y2="265" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="575" y1="175" x2="405" y2="265" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="405" cy="175" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="405" y="180" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="575" cy="175" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="575" y="180" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="575" cy="265" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="575" y="270" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="405" cy="265" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="405" y="270" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="490" y="305" font-family="system-ui,sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="650">+1 × −1 = −1</text>
<line x1="646" y1="220" x2="680" y2="220" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="672" y1="225" x2="680" y2="220" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<line x1="672" y1="215" x2="680" y2="220" stroke="#526171" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/>
<text x="830" y="164" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">Same color list</text>
<text x="830" y="207" font-family="system-ui,sans-serif" font-size="26" fill="#bd3847" text-anchor="middle" font-weight="700">RRRR</text>
<text x="830" y="259" font-family="system-ui,sans-serif" font-size="27" fill="#202d3a" text-anchor="middle" font-weight="700">+1 − 1 = 0</text>
<text x="500" y="366" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">Amplitudes add over matchings; individual products need not survive.</text>
</svg>
