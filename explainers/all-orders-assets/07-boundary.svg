<line x1="824.272" y1="313.5" x2="659.728" y2="218.5" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="742" cy="171" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="742" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">0</text>
<circle cx="824.272" cy="218.5" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="824.272" y="223.5" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="824.272" cy="313.5" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="824.272" y="318.5" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="742" cy="361" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="742" y="366" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="659.728" cy="313.5" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="659.728" y="318.5" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<circle cx="659.728" cy="218.5" r="16" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="659.728" y="223.5" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">5</text>
<text x="742" y="398" font-family="system-ui,sans-serif" font-size="23" fill="#202d3a" text-anchor="middle" font-weight="700">GBBGRR</text>
<text x="742" y="428" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Unit weights: its unwanted amplitude is 1.</text>
<text x="500" y="483" font-family="system-ui,sans-serif" font-size="18" fill="#526171" text-anchor="middle" font-weight="400">Color also uses line pattern: red solid, blue dashed, green dotted.</text>
</svg>
