<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="07-boundary-title 07-boundary-desc">
<title id="07-boundary-title">Four sites work; beyond four, mixed outputs intervene</title>
<desc id="07-boundary-desc">At four sites the red pairing 12,34, blue pairing 13,24 and green pairing 14,23 exhaust all matchings. The six-site example has a mixed matching green 0–3, blue 1–2 and red 4–5, with color list GBBGRR. Unit weights give amplitude one.</desc>
<rect width="1000" height="100%" rx="16" fill="white"/>
<text x="30" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#526171" text-anchor="start" font-weight="700">KRENN–GU / THE ALL-ORDERS PROOF</text>
<text x="30" y="66" font-family="system-ui,sans-serif" font-size="25" fill="#202d3a" text-anchor="start" font-weight="700">Four sites work; beyond four, mixed outputs intervene</text>
<rect x="30" y="105" width="455" height="340" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="257" y="141" font-family="system-ui,sans-serif" font-size="21" fill="#202d3a" text-anchor="middle" font-weight="650">K₄: exactly three matchings</text>
<line x1="65" y1="205" x2="160" y2="205" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<line x1="160" y1="307" x2="65" y2="307" stroke="#bd3847" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/>
<circle cx="65" cy="205" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="65" y="210" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="160" cy="205" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="160" y="210" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="160" cy="307" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="160" y="312" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="65" cy="307" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="65" y="312" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="112" y="352" font-family="system-ui,sans-serif" font-size="20" fill="#bd3847" text-anchor="middle" font-weight="700">RRRR</text>
<line x1="210" y1="205" x2="305" y2="307" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="305" y1="205" x2="210" y2="307" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<circle cx="210" cy="205" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="210" y="210" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="305" cy="205" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="305" y="210" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="305" cy="307" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="305" y="312" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="210" cy="307" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="210" y="312" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="257" y="352" font-family="system-ui,sans-serif" font-size="20" fill="#2168af" text-anchor="middle" font-weight="700">BBBB</text>
<line x1="355" y1="205" x2="355" y2="307" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
<line x1="450" y1="205" x2="450" y2="307" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="355" cy="205" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="355" y="210" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">1</text>
<circle cx="450" cy="205" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="450" y="210" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">2</text>
<circle cx="450" cy="307" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="450" y="312" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">3</text>
<circle cx="355" cy="307" r="13" fill="white" stroke="#202d3a" stroke-width="2"/>
<text x="355" y="312" font-family="system-ui,sans-serif" font-size="15" fill="#202d3a" text-anchor="middle" font-weight="650">4</text>
<text x="402" y="352" font-family="system-ui,sans-serif" font-size="20" fill="#237953" text-anchor="middle" font-weight="700">GGGG</text>
<text x="257" y="398" font-family="system-ui,sans-serif" font-size="20" fill="#526171" text-anchor="middle" font-weight="400">No mixed matching exists.</text>
<text x="257" y="428" font-family="system-ui,sans-serif" font-size="17" fill="#526171" text-anchor="middle" font-weight="400">Unit weights: all three amplitudes are 1.</text>
<rect x="515" y="105" width="455" height="340" rx="12" fill="#f5f7f8" stroke="#d8dedf"/>
<text x="742" y="141" font-family="system-ui,sans-serif" font-size="21" fill="#202d3a" text-anchor="middle" font-weight="650">Six sites: one mixed matching</text>
<line x1="742" y1="171" x2="824.272" y2="218.5" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="824.272" y1="218.5" x2="824.272" y2="313.5" stroke="#2168af" stroke-width="4" stroke-dasharray="9 5" stroke-linecap="round"/>
<line x1="824.272" y1="313.5" x2="742" y2="361" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
