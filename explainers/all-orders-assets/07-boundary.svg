<line x1="659.728" y1="218.5" x2="742" y2="171" stroke="#d8dedf" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round"/>
<line x1="742" y1="171" x2="742" y2="361" stroke="#237953" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
